<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.asset_version | relative_url }}">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

        {% if site.logo %}
          <img class="profile-image" src="{{ site.logo | relative_url }}" alt="Profile image for {{ site.title }}">
        {% endif %}

        <nav aria-label="Site navigation">
          <p class="view"><a href="{{ "/" | relative_url }}">Home</a></p>
          <p class="view"><a href="mailto:htnguyen35@wisc.edu">Contact</a></p>
        </nav>

        {% if site.github.is_project_page %}
          <p class="repository-link"><a href="{{ site.github.repository_url }}">View this site on GitHub <small>{{ site.github.repository_nwo }}</small></a></p>
        {% endif %}
      </header>

      <section class="content" aria-label="Main content">
        {{ content }}
      </section>

      <footer>
        <small>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</small>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
